[package]
name = "orbital-relay"
version = "0.1.0"
edition = "2024"
authors = ["nixon"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", features = ["json", "socks", "multipart"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
futures-util = "0.3"
ipnetwork = "0.20"

# Anti-debug (Linux)
nix = { version = "0.29", features = ["process", "signal", "ptrace"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
