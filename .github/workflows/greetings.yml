name: Greetings
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@a1db7729b356323c7988c20ed6f0d33fe31297be  # v1 immutable pin
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Thanks for opening your first issue here. Please include reproduction steps and the output of `--version` where relevant.'
          pr-message: 'Thanks for your first pull request. CI runs the full matrix; please make sure `ruff` and the focused pytest lanes pass locally first.'
