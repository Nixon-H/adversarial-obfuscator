name: Cross-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux-x86_64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: cargo check --manifest-path runtime/Cargo.toml
      - run: cargo check --manifest-path relay/Cargo.toml
      - run: cargo test --manifest-path runtime/Cargo.toml
      - run: python3 -m pytest tests/ -q --tb=short

  test-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo check --target aarch64-unknown-linux-gnu --manifest-path runtime/Cargo.toml
      - run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo check --target aarch64-unknown-linux-gnu --manifest-path relay/Cargo.toml

  test-windows-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: |
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
            cargo check --target x86_64-pc-windows-gnu --manifest-path runtime/Cargo.toml
      - run: |
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
            cargo check --target x86_64-pc-windows-gnu --manifest-path relay/Cargo.toml

  native-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 python3-dev
      - run: make native-test
      - run: python3 -m pytest tests/test_native_compile.py -v
