name: Cross-Platform

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: read-only default token.
permissions:
  contents: read

jobs:
  test-linux-x86_64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # requirements.lock, not bare pytest: the suite imports the
      # lock's dependency closure (cryptography, PyYAML, ...).
      - run: pip install --require-hashes -r requirements.lock
      # ruff is a test dependency: test_python310_compat and
      # test_lint_cleanup_safety shell out to it.
      - run: pip install -r requirements-dev.txt
      - run: cargo check --manifest-path runtime/Cargo.toml
      - run: cargo check --manifest-path relay/Cargo.toml
      - run: cargo test --manifest-path runtime/Cargo.toml
      - run: python3 -m pytest tests/ -q --tb=short

  # NOTE (python pins): test-linux-arm64 and test-windows-x86_64 pin a
  # single python (3.11) intentionally — they are cargo-check-only
  # cross-compile smoke jobs where the interpreter version is irrelevant
  # (setup-python just provides a hermetic python for build scripts).
  # The real version matrix (3.10-3.14) lives in test-linux-x86_64 above
  # and in ci.yml; multiplying these cross jobs x5 would burn runner
  # minutes for zero signal.
  test-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo check --target aarch64-unknown-linux-gnu --manifest-path runtime/Cargo.toml
      - run: |
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo check --target aarch64-unknown-linux-gnu --manifest-path relay/Cargo.toml

  test-windows-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      - run: |
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
            cargo check --target x86_64-pc-windows-gnu --manifest-path runtime/Cargo.toml
      - run: |
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc \
            cargo check --target x86_64-pc-windows-gnu --manifest-path relay/Cargo.toml

  native-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 python3-dev file
      - run: pip install pytest
      - run: make native-test
      - run: python3 -m pytest tests/test_native_compile.py -v
