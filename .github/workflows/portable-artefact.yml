name: Portable artefact (all OS)

# Tests the claim that ONE committed file runs on every OS with no native library.
# The same bytes are run on Linux, Windows and macOS: that is the only way to test
# portability, and rebuilding per-OS would test the builder instead.

on:
  push:
    branches: [master, main]
    paths:
      - 'tests/fixtures/portable/**'
      # The whole directory, not one file: a commit that only touched
      # audit_artefact.py did not trigger this workflow at all.
      - 'scripts/ci/**'
      - '.github/workflows/portable-artefact.yml'
  pull_request:
    paths:
      - 'tests/fixtures/portable/**'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-artefact:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One Python version on purpose: the artefact pins the interpreter it was
      # built for and refuses to run elsewhere ("Required: 3.13 | Found: 3.10").
      # That fail-closed gate is a feature; the axis under test here is the OS.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The artefact hashes its own bytes. If a checkout rewrites them, the
      # self-check refuses to run -- so print what each OS actually received.
      - name: Bytes received by this runner
        if: always()
        shell: bash
        run: |
          python - <<'EOF'
          import hashlib, os
          p = "tests/fixtures/portable/secure_demo_protected.py"
          b = open(p, "rb").read()
          print("size:", len(b))
          print("sha256:", hashlib.sha256(b).hexdigest())
          print("crlf:", b.count(b"\r\n"), "lf:", b.count(b"\n"))
          print("first bytes:", b[:40])
          EOF

      # No dependencies installed on purpose: the artefact must run on a bare
      # interpreter, and the checker imports nothing from the project.
      - name: Run the committed artefact and compare to its source
        run: python scripts/ci/check_portable_artefact.py

      - name: Confirm no native library is required
        shell: bash
        run: |
          grep -q "nixon_core" tests/fixtures/portable/secure_demo_protected.py \
            && { echo "artefact references nixon_core"; exit 1; } || echo "no native reference"
          find . -name "nixon_core*" -not -path "./.git/*" | head -5

  audit-environments:
    name: audit ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Twelve environments a single happy-path run cannot cover: odd paths,
      # other working directories, hash seeds, read-only dirs, tampered copies.
      - name: Audit the artefact under varied environments
        run: python scripts/ci/audit_artefact.py
