name: diag-build

# Temporary: kill the build during verification, then run the generated
# artifact under faulthandler to see where 3.13/3.14 spend ~500s.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build 60s, then run the generated artifact with a stack dump
        run: |
          mkdir -p /tmp/diag && cd /tmp/diag
          printf 'print("DIAG-PAYLOAD")\n' > hello.py
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export NIXON_LOG_REDIRECT=0
          set +e
          timeout 60 python3 -u -m obfuscator.core.pipeline build hello.py \
              --net-url https://127.0.0.1:9443/ > /tmp/diag/build.log 2>&1
          echo "build_rc=$?"
          tail -12 /tmp/diag/build.log
          echo "--- generated candidates:"
          ls -la "$GITHUB_WORKSPACE/build" | head -20
          ls -la /tmp/diag | head -10
          ART=$(ls -t "$GITHUB_WORKSPACE"/build/.build_tmp_*obfuscated*.py 2>/dev/null | head -1)
          [ -z "$ART" ] && ART=$(ls -t /tmp/diag/*Nixon*.py 2>/dev/null | head -1)
          [ -z "$ART" ] && ART=$(ls -t /tmp/diag/*.py | grep -v hello.py | head -1)
          echo "ART=$ART"
          export PYTHONFAULTHANDLER=1
          start=$(date +%s)
          timeout -s ABRT 120 python3 "$ART" 2>&1 | tail -60
          echo "run_rc=$? seconds=$(( $(date +%s) - start ))"
