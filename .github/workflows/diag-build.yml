name: diag-build

# Temporary: locate the 3.13/3.14 slowness precisely.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build (timed)
        run: |
          mkdir -p /tmp/diag && cd /tmp/diag
          printf 'print("DIAG-PAYLOAD")\n' > hello.py
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export NIXON_LOG_REDIRECT=0
          start=$(date +%s)
          set +e
          timeout 900 python3 -u -m obfuscator.core.pipeline build hello.py \
              --net-url https://127.0.0.1:9443/ 2>&1 \
            | while IFS= read -r line; do
                printf '%5d %s\n' "$(( $(date +%s) - start ))" "$line"
              done
          echo "TOTAL=$(( $(date +%s) - start ))s"
          ls -la /tmp/diag/dist | head
      - name: Run the artifact with a stack dump at 90s
        run: |
          cd /tmp/diag
          ART=$(ls dist/*_protected*.py 2>/dev/null | head -1)
          echo "artifact=$ART"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export PYTHONFAULTHANDLER=1
          export NIXON_LOG_REDIRECT=0
          start=$(date +%s)
          set +e
          timeout -s ABRT 90 python3 "$ART" 2>&1 | tail -40
          echo "RUN_RC=$? RUN_SECONDS=$(( $(date +%s) - start ))"
