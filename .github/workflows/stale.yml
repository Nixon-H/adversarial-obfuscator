name: Stale
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v9 immutable pin
        with:
          stale-issue-message: 'This issue has been inactive for 60 days. Comment to keep it open.'
          stale-pr-message: 'This pull request has been inactive for 60 days. Comment to keep it open.'
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'pinned,security,benchmark-evidence'
          exempt-pr-labels: 'pinned,security,work-in-progress'
