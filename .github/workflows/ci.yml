name: CI

on:
  push:
  pull_request:
  # Weekly ruff-pin review (see the lint-pin job). A job cannot declare
  # its own schedule — GitHub only allows `schedule` here — so the other
  # jobs carry `if: github.event_name != 'schedule'` and only lint-pin
  # runs on the cron.
  schedule:
    - cron: "0 6 * * 1"    # Mondays
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN for this workflow is read-only.
# Jobs that need more must declare it explicitly per-job.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version matrix (py_matrix.py SUPPORTED): NYSER1 fields, loader
        # bytecodes and C-API offsets drift per minor — a skew bug would
        # otherwise ship silently (CI previously pinned 3.12 only).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install LLVM (llc for the lowering tests)
        # tests/test_native_lowering.py carries ~21 regression tests for
        # the IR -> LLVM defects (shr dropped, gep losing indices, phi
        # repair, the string-operand guard, ...). They skip when llc is
        # absent, which it is on the runner image -- so the whole set was
        # green by never running. A skipped test is a test CI is not
        # running.
        run: |
          if ! command -v llc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          if ! command -v llc >/dev/null 2>&1; then
            LLC="$(ls /usr/lib/llvm-*/bin/llc 2>/dev/null | head -1)"
            if [ -n "$LLC" ]; then sudo ln -sf "$LLC" /usr/local/bin/llc; fi
          fi
          command -v llc
          llc --version | head -1
      - name: Install dependencies
        # requirements.lock is hash-pinned and carries the runtime + test
        # closure.  requirements-dev.txt adds the pinned linter: six
        # tests shell out to `ruff` (test_python310_compat.py and
        # test_lint_cleanup_safety.py) and, without it, failed with
        # FileNotFoundError on every matrix job while passing on any
        # developer machine.  A test dependency belongs in the job that
        # runs the test.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Build native artefacts
        # BEFORE the tests.  Nineteen tests need a compiled artefact
        # (the C shared libraries, the Rust relay) and SKIP themselves
        # when it is absent -- so with the build after the tests, CI
        # never ran them either.  A test that skips is a test that
        # proves nothing.
        #
        # `make microjit-so` was removed on 2026-10-23: native/microjit.c
        # is archived (nothing loaded the .so it produced — see
        # archive/native/README.md).
        run: |
          make core
          make wb
          make py_compile
          make relay
      - name: Python tests
        # NIXON_REQUIRE_ARTEFACTS makes the artefact gate fail the
        # build if a compiled artefact is missing, instead of letting
        # the nineteen tests that need it skip quietly.
        env:
          NIXON_REQUIRE_ARTEFACTS: "1"
        # -u: unbuffered, so the log timestamps each test as it starts
        # instead of in 4 KB chunks; that is what made the 3.13/3.14
        # slowness impossible to attribute to a test.
        run: python3 -u -m pytest tests/ -v
      - name: End-to-end artifact check
        # Build a payload on THIS Python version, run the artifact, and
        # assert the output.  The unit suite proves the modules import
        # on this version; this proves the BUILD works on it.  The
        # seal-corruption bug shipped because neither was true.
        run: python3 scripts/lint/e2e_build_check.py 1
      - name: Rust runtime tests
        run: cd runtime && cargo test
      - name: Rust relay tests
        run: cd relay && cargo test
      - name: Build check runtime
        run: cd runtime && cargo check
      - name: Build check relay
        run: cd relay && cargo check
      - name: Static analysis
        run: python3 -m py_compile obfuscator/*.py irgen/*.py llvmgen/*.py scripts/*.py vm/*.py encrypt/*.py tests/*.py

  pip-audit:
    if: github.event_name != 'schedule'
    # Supply chain HARD gate: pip-audit exits nonzero when any advisory
    # matches a pinned dependency, and continue-on-error stays false (the
    # default) so a vulnerable pin breaks the build until a human bumps
    # the pin after reviewing the advisory. Deliberately no --fix
    # auto-mutation in CI. NOTE (2026-09-28): pins were bumped
    # (requests 2.33.0, urllib3 2.7.0, cryptography 50.0.0, pytest 9.0.3)
    # and a local `pip-audit -r requirements.txt` run reports clean, so
    # this job is green on current pins. That is the gate working as
    # designed: it will go red the moment a new advisory matches a pin.
    #
    # The LOCK is audited as well as requirements.txt: the lock is what
    # CI installs, and it carries the transitive closure, so a
    # vulnerable indirect dependency is only visible there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit the direct pins (hard gate)
        run: pip-audit -r requirements.txt --desc
      - name: Audit the hash-pinned lock (hard gate)
        run: pip-audit -r requirements.lock --desc

  gitleaks:
    if: github.event_name != 'schedule'
    # Secret scanning on every push/PR: default rule set plus the
    # .gitleaks.toml allowlist (RFC 8439 test vector in
    # tests/test_chacha20_strings.py and gitignored build/ artifacts — both
    # verified false positives, allowlist verified green locally 2026-09-28).
    # Pinned to the v2 major line; watch gitleaks/gitleaks-action releases
    # for v3 migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-diff:
    if: github.event_name != 'schedule'
    # Informational only, never gates: surface requirements.txt history for
    # human review. Always exits 0 (|| true); reviewers check the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show requirements.txt diff (informational)
        run: |
          git log --oneline -3 -- requirements.txt
          git diff HEAD~1 -- requirements.txt || true

  lint-pin:
    # The ruff pin is deliberate -- an unpinned linter can turn a green
    # tree red with no change to the code -- but a pin that is never
    # reviewed goes stale.  This job reports (it never gates): it says
    # whether a newer ruff exists, so the bump is a reviewed act.
    # `make lint-upgrade` prints the same thing locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare the pinned ruff with the latest release
        run: |
          pip install -q ruff
          pinned=$(grep '^ruff==' requirements-dev.txt | cut -d= -f3)
          latest=$(pip index versions ruff 2>/dev/null | head -1 | awk '{print $3}')
          echo "pinned: $pinned"
          echo "latest: $latest"
          if [ -n "$latest" ] && [ "$pinned" != "$latest" ]; then
            echo "::notice title=ruff pin is behind::A newer ruff ($latest) is available; the pin is $pinned. Review the new findings and bump requirements-dev.txt deliberately (make lint-upgrade)."
          else
            echo "the ruff pin is current"
          fi
      - name: Report what a newer ruff would say (informational)
        continue-on-error: true
        run: |
          pip install -q "ruff!=$(grep '^ruff==' requirements-dev.txt | cut -d= -f3)" || true
          ruff check --no-cache . || echo "the newer ruff reports findings; review them before bumping the pin"
