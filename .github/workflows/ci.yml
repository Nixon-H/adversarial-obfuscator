name: CI

on:
  workflow_call:
  # PR + merge-queue coverage (review register, fourth pass, item 2): a
  # required check must run for pull_request AND merge_group events, or
  # GitHub's merge queue cannot use it as a gate.
  pull_request:
  merge_group:
  # Weekly run: the full matrix (the `test` job has no schedule guard any
  # more) plus the ruff-pin review. A green cron now means the suite is
  # green, not merely that lint-pin ran.
  workflow_dispatch:
# Least privilege: the default GITHUB_TOKEN for this workflow is read-only.
# Jobs that need more must declare it explicitly per-job.
permissions:
  contents: read

# Superseded runs are cancelled. Without this, every push queued a fresh
# five-version matrix and the queue grew to 24 runs on one branch -- so the
# newest commit waited behind stale ones and the red/green verdict for HEAD
# was effectively unavailable. A queue is not feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The unit suite is build-heavy: 45 minutes cancelled it mid-run
    # (measured 45m15s before the kill). 180 leaves room for a loaded
    # runner without going back to GitHub's 360-minute default.
    timeout-minutes: 180
    # Runs on the weekly cron as well: previously every matrix job carried
    # `if: event != 'schedule'`, so Monday's "success" only meant lint-pin
    # had run and the suite could rot for weeks unnoticed.
    runs-on: ubuntu-latest
    # RELEASE-BUILDER POLICY AT JOB SCOPE (review register, P1: "verify
    # coverage of all jobs"). These env vars were scoped to the pytest step,
    # but three MORE steps in this job build artefacts -- "Build native
    # artefacts", "End-to-end artifact check" (e2e_build_check.py invokes the
    # real pipeline) and the py_compile sweep -- and an artefact built by a
    # drifted toolchain in any of them would only have WARNED. Every
    # artefact-producing step now inherits the policy: a drifted toolchain is
    # a failed CI run, wherever in this job the build happens.
    env:
      NIXON_REQUIRE_ARTEFACTS: "1"
      NIXON_REQUIRE_DEP_LOCK: "1"
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # Version matrix (py_matrix.py SUPPORTED): NYSER1 fields, loader
        # bytecodes and C-API offsets drift per minor — a skew bug would
        # otherwise ship silently (CI previously pinned 3.12 only).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install LLVM (llc for the lowering tests)
        # tests/test_native_lowering.py carries ~21 regression tests for
        # the IR -> LLVM defects (shr dropped, gep losing indices, phi
        # repair, the string-operand guard, ...). They skip when llc is
        # absent, which it is on the runner image -- so the whole set was
        # green by never running. A skipped test is a test CI is not
        # running.
        run: |
          if ! command -v llc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          if ! command -v llc >/dev/null 2>&1; then
            LLC="$(ls /usr/lib/llvm-*/bin/llc 2>/dev/null | head -1)"
            if [ -n "$LLC" ]; then sudo ln -sf "$LLC" /usr/local/bin/llc; fi
          fi
          command -v llc
          llc --version | head -1
      - name: Install dependencies
        # requirements.lock is hash-pinned and carries the runtime + test
        # closure.  requirements-dev.txt adds the pinned linter: six
        # tests shell out to `ruff` (test_python310_compat.py and
        # test_lint_cleanup_safety.py) and, without it, failed with
        # FileNotFoundError on every matrix job while passing on any
        # developer machine.  A test dependency belongs in the job that
        # runs the test.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
      - name: Build native artefacts
        # BEFORE the tests.  Nineteen tests need a compiled artefact
        # (the C shared libraries, the Rust relay) and SKIP themselves
        # when it is absent -- so with the build after the tests, CI
        # never ran them either.  A test that skips is a test that
        # proves nothing.
        #
        # `make microjit-so` was removed on 2026-10-23: native/microjit.c
        # is archived (nothing loaded the .so it produced — see
        # archive/native/README.md).
        run: |
          make core
          make wb
          make py_compile
          make relay
      - name: Python tests
        # NIXON_REQUIRE_ARTEFACTS makes the artefact gate fail the
        # build if a compiled artefact is missing, instead of letting
        # the nineteen tests that need it skip quietly.
        #
        # NIXON_REQUIRE_DEP_LOCK (2026-11-20): the build only WARNS on
        # dependency drift by default, and CI installed a drifted
        # toolchain (Cython 3.2.1 against a 3.0.12 lock) on every run
        # while still reporting green. Release CI must fail on drift:
        # an artefact compiled by an unapproved toolchain is not the
        # artefact the lock file describes.
        env:
          NIXON_REQUIRE_ARTEFACTS: "1"
          NIXON_REQUIRE_DEP_LOCK: "1"
        # -u: unbuffered, so the log timestamps each test as it starts
        # instead of in 4 KB chunks; that is what made the 3.13/3.14
        # slowness impossible to attribute to a test.
        run: python3 -u -m pytest tests/ -v
      - name: End-to-end artifact check
        # Build a payload on THIS Python version, run the artifact, and
        # assert the output.  The unit suite proves the modules import
        # on this version; this proves the BUILD works on it.  The
        # seal-corruption bug shipped because neither was true.
        run: python3 scripts/lint/e2e_build_check.py 1
      - name: Rust runtime tests
        run: cd runtime && cargo test
      - name: Rust relay tests
        run: cd relay && cargo test
      - name: Build check runtime
        run: cd runtime && cargo check
      - name: Build check relay
        run: cd relay && cargo check
      - name: Static analysis
        run: python3 -m py_compile obfuscator/*.py irgen/*.py llvmgen/*.py scripts/*.py vm/*.py encrypt/*.py tests/*.py

  release-acceptance:
    # PERMANENT RELEASE-ACCEPTANCE GATE (review register, third pass, item 1:
    # "turn the manual RC acceptance into a permanent release gate"). One
    # clean-checkout run builds a SIGNED artefact, verifies the exact
    # published bytes, and executes the refusal matrix. The matrix rows and
    # required results are the register's table verbatim; the job FAILS the
    # release when any row accepts what must be refused. The signing keys are
    # generated per run (secrets) and never leave the job — a release key
    # comes from the operator's secret store in the release workflow, not
    # here.
    timeout-minutes: 60
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # LEAST PRIVILEGE (review register, fourth pass, item 3): the
    # acceptance job generates its own ephemeral keys and needs NO
    # repository write access — the default read-only workflow permission
    # is narrowed to nothing beyond contents:read it already inherits.
    permissions:
      contents: read
    env:
      NIXON_LOG_REDIRECT: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install build dependencies
        # HASH-PINNED (finding AI-SC-003). Was `pip install cython==3.0.12
        # setuptools wheel`: setuptools and wheel unpinned, no hashes, in the
        # acceptance-matrix job.
        run: pip install --require-hashes -r requirements.lock && sudo apt-get update && sudo apt-get install -y upx
      - name: Build and run the acceptance matrix
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, secrets, subprocess, sys
          # `re` is REQUIRED: this block calls re.search (provenance-key pin
          # check at ~line 229) and re.sub (~line 258). It was missing from
          # the import list, so the step raised NameError and the
          # release-acceptance check could never reach a verdict. Found by
          # the supply-chain auditor (AI-SC-001).
          import re
          from obfuscator.build_manifest import verify_manifest, sign_manifest, build_manifest
          from obfuscator.attestation import stamp_artefact
          from obfuscator.licensing import private_key_from_hex, public_key_hex
          from cryptography.hazmat.primitives import serialization

          art = None
          results = []

          def rec(name, ok, detail=""):
              results.append(dict(name=name, ok=bool(ok), detail=str(detail)[:120]))
              print("%-4s %-48s %s" % ("PASS" if ok else "FAIL", name, detail[:110]))
              return bool(ok)

          def run(path, pin=None):
              e = dict(os.environ)
              if pin is None:
                  e.pop("NIXON_PROVENANCE_PUBKEY", None)
              else:
                  e["NIXON_PROVENANCE_PUBKEY"] = pin
              return subprocess.run([sys.executable, path], capture_output=True,
                                    text=True, timeout=120, cwd=os.getcwd())

          # 1. SIGNED BUILD from the clean checkout.
          key = secrets.token_hex(32)
          pin = public_key_hex(private_key_from_hex(key))
          os.environ["NIXON_ARTEFACT_SIGN_KEY"] = key
          os.environ["NIXON_BUILD_MANIFEST_KEY"] = key
          os.environ["NIXON_REQUIRE_PROVENANCE"] = "1"
          b = subprocess.run([sys.executable, "-m", "obfuscator.core.pipeline",
                              "build", "tests/fixtures/payload_probe.py",
                              "--skip-cloud", "--section-count", "4",
                              "--watermark", "NX-CI-001", "--transforms", "data",
                              "--access", "trial=7d", "--package", "native"],
                             capture_output=True, text=True, timeout=1500)
          assert b.returncode == 0, "build failed: " + (b.stderr or "")[-500:]
          staging = None
          for root, _dirs, files in os.walk("."):
              if "payload_protected.py" in files and ".build-manifest.json" in files:
                  art = os.path.join(root, "payload_protected.py")
                  break
          assert art, "no artefact + manifest produced"
          published = open(art, "rb").read()
          rec("build: signed artefact from clean checkout", True, "%d bytes" % len(published))

          # 2. FINAL-BYTES VERIFICATION.
          mres = verify_manifest(art)
          rec("manifest verify on published bytes", mres["ok"] is True, mres.get("reason", ""))
          rec("manifest is signed", mres.get("signed") is True)
          manifest = json.load(open(art + ".build-manifest.json", encoding="utf-8"))
          rec("manifest binds the source commit",
              (manifest.get("build") or {}).get("commit") ==
              subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True,
                             text=True).stdout.strip())
          rec("manifest binds the dependency-lock digest",
              bool((manifest.get("build") or {}).get("dependency_lock_digest")))
          text = published.decode("utf-8", "replace")
          m = re.search(r'_NX_PROV_PK = "([0-9a-f]{16}): ([A-Za-z0-9+/=]+)"', text)
          pin_bytes = base64.b64decode(m.group(2))
          rec("embedded key fingerprint self-consistent",
              m.group(1) == hashlib.sha256(pin_bytes).hexdigest()[:16])

          # 3. REFUSAL MATRIX (each row RUNS the artefact).
          def pinned_run(env_overrides=None):
              e = dict(os.environ)
              if env_overrides is None:
                  e["NIXON_PROVENANCE_PUBKEY"] = pin_bytes.hex()
              else:
                  e.update(env_overrides)
              return subprocess.run([sys.executable, art], capture_output=True,
                                    text=True, timeout=120, env=e, cwd=os.getcwd())

          ctrl = pinned_run()
          rec("accept: correct key + correct pin", ctrl.returncode == 0)
          nopin = pinned_run({"NIXON_PROVENANCE_PUBKEY": ""})
          os.environ.pop("NIXON_PROVENANCE_PUBKEY", None)
          nopin2 = subprocess.run([sys.executable, art], capture_output=True,
                                  text=True, timeout=120, cwd=os.getcwd())
          os.environ["NIXON_PROVENANCE_PUBKEY"] = pin_bytes.hex()
          rec("reject: missing pin", nopin2.returncode != 0)
          wrong = pinned_run({"NIXON_PROVENANCE_PUBKEY": private_key_from_hex(
              secrets.token_hex(32)).public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw).hex()})
          rec("reject: incorrect pin", wrong.returncode != 0)
          nosig_path = art.replace(".py", "_nosig.py")
          open(nosig_path, "w", encoding="utf-8").write(re.sub(
              r'_NX_PROV_SIG = "[^"]*"', '_NX_PROV_SIG = ""', text, count=1))
          rec("reject: missing provenance signature",
              run(nosig_path, pin_bytes.hex()).returncode != 0)
          tam = bytearray(published)
          tam[len(tam) // 2] ^= 0x01
          tam_path = art.replace(".py", "_modified.py")
          open(tam_path, "wb").write(bytes(tam))
          rec("reject: modified artefact",
              run(tam_path, pin_bytes.hex()).returncode != 0)

          # Manifest re-signed by an untrusted key: the verifier, holding the
          # publisher public key, must reject it.
          attacker = __import__("cryptography.hazmat.primitives.asymmetric.ed25519",
                                fromlist=["ed25519"]).Ed25519PrivateKey.generate()
          forged = sign_manifest(build_manifest(art), attacker)
          fpath = art.replace(".py", "_forged.json")
          with open(fpath, "w", encoding="utf-8") as fh:
              json.dump(forged, fh, indent=2, sort_keys=True)
          import shutil
          art_forged = art.replace(".py", "_forged.py")
          shutil.copyfile(art, art_forged)
          shutil.copyfile(fpath, art_forged + ".build-manifest.json")
          pub = private_key_from_hex(key).public_key()
          rec("reject: manifest signed by an untrusted key",
              verify_manifest(art_forged, pub)["ok"] is False)
          rec("accept: valid signed artefact after packaging",
              verify_manifest(art, pub)["ok"] is True)

          # 4. TEST PROVENANCE: commit + lock digest in the record.
          rec("record: commit + lock digest in the acceptance report",
              bool((manifest.get("build") or {}).get("commit")) and
              bool((manifest.get("build") or {}).get("dependency_lock_digest")))

          verdict = "PASS" if all(r["ok"] for r in results) else "FAIL"
          out = art.replace("payload_protected.py", "acceptance_report.json")
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(dict(schema="nx-release-acceptance/v1", checks=results,
                             verdict=verdict), fh, indent=2, sort_keys=True)
          print("\nverdict:", verdict)
          if verdict != "PASS":
              raise SystemExit(1)
          PY
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: "**/acceptance_report.json"
          retention-days: 7

  pip-audit:
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    # Supply chain HARD gate: pip-audit exits nonzero when any advisory
    # matches a pinned dependency, and continue-on-error stays false (the
    # default) so a vulnerable pin breaks the build until a human bumps
    # the pin after reviewing the advisory. Deliberately no --fix
    # auto-mutation in CI. NOTE (2026-09-28): pins were bumped
    # (requests 2.33.0, urllib3 2.7.0, cryptography 50.0.0, pytest 9.0.3)
    # and a local `pip-audit -r requirements.txt` run reports clean, so
    # this job is green on current pins. That is the gate working as
    # designed: it will go red the moment a new advisory matches a pin.
    #
    # The LOCK is audited as well as requirements.txt: the lock is what
    # CI installs, and it carries the transitive closure, so a
    # vulnerable indirect dependency is only visible there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Install pip-audit
        # VERSION-PINNED (finding AI-SC-003 remainder). `pip install pip-audit`
        # was unpinned, so the auditor itself could change between runs and a
        # silent version bump would alter what the gate reports.
        #
        # Full --require-hashes is NOT applied here and the reason is stated
        # rather than glossed: pip-audit's own dependency tree is large and
        # changes frequently, and it is a verification TOOL rather than a build
        # input -- it never runs inside the artefact and contributes no code to
        # the deliverable. Pinning the version makes a change visible in review,
        # which is the property that matters for an auditor. The build
        # dependencies themselves ARE hash-locked above.
        run: pip install pip-audit==2.10.1
      - name: Audit the direct pins (hard gate)
        run: pip-audit -r requirements.txt --desc
      - name: Audit the hash-pinned lock (hard gate)
        run: pip-audit -r requirements.lock --desc

  gitleaks:
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    # Secret scanning on every push/PR: default rule set plus the
    # .gitleaks.toml allowlist (RFC 8439 test vector in
    # tests/test_chacha20_strings.py and gitignored build/ artifacts — both
    # verified false positives, allowlist verified green locally 2026-09-28).
    # Pinned to the v2 major line; watch gitleaks/gitleaks-action releases
    # for v3 migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-diff:
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    # Informational only, never gates: surface requirements.txt history for
    # human review. Always exits 0 (|| true); reviewers check the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Show requirements.txt diff (informational)
        run: |
          git log --oneline -3 -- requirements.txt
          git diff HEAD~1 -- requirements.txt || true

  lint-pin:
    timeout-minutes: 45
    # The ruff pin is deliberate -- an unpinned linter can turn a green
    # tree red with no change to the code -- but a pin that is never
    # reviewed goes stale.  This job reports (it never gates): it says
    # whether a newer ruff exists, so the bump is a reviewed act.
    # `make lint-upgrade` prints the same thing locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - name: Compare the pinned ruff with the latest release
        run: |
          pip install -q ruff
          pinned=$(grep '^ruff==' requirements-dev.txt | cut -d= -f3)
          latest=$(pip index versions ruff 2>/dev/null | head -1 | awk '{print $3}')
          echo "pinned: $pinned"
          echo "latest: $latest"
          if [ -n "$latest" ] && [ "$pinned" != "$latest" ]; then
            echo "::notice title=ruff pin is behind::A newer ruff ($latest) is available; the pin is $pinned. Review the new findings and bump requirements-dev.txt deliberately (make lint-upgrade)."
          else
            echo "the ruff pin is current"
          fi
      - name: Report what a newer ruff would say (informational)
        continue-on-error: true
        run: |
          pip install -q "ruff!=$(grep '^ruff==' requirements-dev.txt | cut -d= -f3)" || true
          ruff check --no-cache . || echo "the newer ruff reports findings; review them before bumping the pin"
