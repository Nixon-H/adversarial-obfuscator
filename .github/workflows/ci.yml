name: CI

on: [push, pull_request]

# Least privilege: the default GITHUB_TOKEN for this workflow is read-only.
# Jobs that need more must declare it explicitly per-job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version matrix (py_matrix.py SUPPORTED): NYSER1 fields, loader
        # bytecodes and C-API offsets drift per minor — a skew bug would
        # otherwise ship silently (CI previously pinned 3.12 only).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python tests
        run: python3 -m pytest tests/ -v
      - name: End-to-end artifact check
        # Build a payload on THIS Python version, run the artifact, and
        # assert the output.  The unit suite proves the modules import
        # on this version; this proves the BUILD works on it.  The
        # seal-corruption bug shipped because neither was true.
        run: python3 scripts/lint/e2e_build_check.py 1
      - name: Rust runtime tests
        run: cd runtime && cargo test
      - name: Rust relay tests
        run: cd relay && cargo test
      - name: Build check runtime
        run: cd runtime && cargo check
      - name: Build check relay
        run: cd relay && cargo check
      - name: Static analysis
        run: python3 -m py_compile obfuscator/*.py irgen/*.py llvmgen/*.py scripts/*.py vm/*.py encrypt/*.py tests/*.py
      - name: Build C shared libs
        run: make core

  pip-audit:
    # Supply chain HARD gate: pip-audit exits nonzero when any advisory
    # matches requirements.txt, and continue-on-error stays false (the
    # default) so a vulnerable pin breaks the build until a human bumps the
    # pin in requirements.txt after reviewing the advisory. Deliberately no
    # --fix auto-mutation in CI. NOTE (2026-09-28): pins were bumped
    # (requests 2.33.0, urllib3 2.7.0, cryptography 50.0.0, pytest 9.0.3)
    # and a local `pip-audit -r requirements.txt` run reports clean, so
    # this job is green on current pins. That is the gate working as
    # designed: it will go red the moment a new advisory matches a pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit pinned dependencies (hard gate)
        run: pip-audit -r requirements.txt --desc

  gitleaks:
    # Secret scanning on every push/PR: default rule set plus the
    # .gitleaks.toml allowlist (RFC 8439 test vector in
    # tests/test_chacha20_strings.py and gitignored build/ artifacts — both
    # verified false positives, allowlist verified green locally 2026-09-28).
    # Pinned to the v2 major line; watch gitleaks/gitleaks-action releases
    # for v3 migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-diff:
    # Informational only, never gates: surface requirements.txt history for
    # human review. Always exits 0 (|| true); reviewers check the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show requirements.txt diff (informational)
        run: |
          git log --oneline -3 -- requirements.txt
          git diff HEAD~1 -- requirements.txt || true
