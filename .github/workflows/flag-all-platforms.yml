name: Flags x all platforms (manual + release)

# Every catalogue flag (30 today), isolated, on all three operating systems at
# the newest Python. This is coverage tier A1: it answers "does this flag work
# everywhere" for the whole catalogue, not for a sample.
#
# 3 shards x 10 flags x 3 OSes = 9 jobs.
# Runs manually while stabilising, and automatically on every published release.

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  isolate:
    name: ${{ matrix.os }} shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      max-parallel: 16
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pinned immutable; original actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build and run 10 flags on this platform
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "3"
          NX_BUILD_TIMEOUT: "1800"
          PYTHONHASHSEED: "0"
          NX_BUILD_SEED: "12345"
        run: python scripts/ci/isolate_flags.py --start $(( ${{ matrix.shard }} * 10 )) --count 10
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # pinned immutable; original actions/upload-artifact@v4
        with:
          name: failing-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: |
            ci-artifacts/
            build/*_obfuscated.py
            ci-artifacts/*.py
          if-no-files-found: ignore
