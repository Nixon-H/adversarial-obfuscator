name: Flags x all platforms x all Pythons (manual + release)

# The full cross product: every catalogue flag (30 today), isolated, on every
# OS and every supported interpreter.
#
# 3 shards x 10 flags x 3 OSes x 5 Pythons = 45 jobs, all 30 catalogue flags.
# Kept at 45 jobs by running 10 flags sequentially per job --
# GitHub caps a matrix at 256 jobs.
#
# This is the release gate. It must be green before a release is considered
# stable; it runs manually while stabilising and on every published release.

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  isolate:
    name: ${{ matrix.os }} py${{ matrix.python }} shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200
    strategy:
      max-parallel: 24
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pinned immutable; original actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pinned immutable; original actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install builder dependencies
        if: "!(matrix.os == 'windows-latest' && matrix.python == '3.14')"
        run: pip install --require-hashes -r requirements.lock
      - name: Install the stack WITHOUT numpy (Windows + CPython 3.14)
        # numpy 2.2.4 publishes no cp314 wheel for Windows, so pip would compile
        # it from source and fail. Nothing else in the lock depends on numpy and
        # the project degrades gracefully without it (obfuscator/core/np_safe.py),
        # so this pairing gets the rest of the stack and still runs every flag --
        # rather than being excluded from the matrix.
        if: matrix.os == 'windows-latest' && matrix.python == '3.14'
        run: |
          python scripts/ci/requirements_without.py numpy "$RUNNER_TEMP/req-no-numpy.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/req-no-numpy.txt"
      - name: Build and run 10 flags for this OS and interpreter
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "3"
          NX_BUILD_TIMEOUT: "1800"
          PYTHONHASHSEED: "0"
          NX_BUILD_SEED: "12345"
        run: python scripts/ci/isolate_flags.py --start $(( ${{ matrix.shard }} * 10 )) --count 10
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pinned immutable; original actions/upload-artifact@v7
        with:
          name: failing-${{ matrix.os }}-py${{ matrix.python }}-shard-${{ matrix.shard }}
          path: |
            ci-artifacts/
            build/*_obfuscated.py
          if-no-files-found: ignore
