name: Portable build matrix (deep)

# The configurations, isolated packing flags and isolated ladder transforms.
# These are the expensive half of the matrix: 32 jobs. They ran on every push
# until the runner queue could no longer keep up, at which point pushing made
# verification slower rather than faster.
#
# They still run in full -- on demand, and once a week -- and every job is
# capped at 45 minutes so nothing can hold a runner for the platform's six-hour
# job limit.

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  configs:
    name: config ${{ matrix.label }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: 2sections-3zips-L3
            sections: "2"
            zips: "3"
            level: "3"
          - os: ubuntu-latest
            label: 8sections-1zip-L4
            sections: "8"
            zips: "1"
            level: "4"
          - os: ubuntu-latest
            label: 6sections-2zips-L5
            sections: "6"
            zips: "2"
            level: "5"
          - os: ubuntu-latest
            label: 12sections-2zips-L5
            sections: "12"
            zips: "2"
            level: "5"
          - os: windows-latest
            label: 2sections-3zips-L3
            sections: "2"
            zips: "3"
            level: "3"
          - os: windows-latest
            label: 8sections-1zip-L4
            sections: "8"
            zips: "1"
            level: "4"
          - os: windows-latest
            label: 6sections-2zips-L5
            sections: "6"
            zips: "2"
            level: "5"
          - os: windows-latest
            label: 12sections-2zips-L5
            sections: "12"
            zips: "2"
            level: "5"
          - os: macos-latest
            label: 2sections-3zips-L3
            sections: "2"
            zips: "3"
            level: "3"
          - os: macos-latest
            label: 8sections-1zip-L4
            sections: "8"
            zips: "1"
            level: "4"
          - os: macos-latest
            label: 6sections-2zips-L5
            sections: "6"
            zips: "2"
            level: "5"
          - os: macos-latest
            label: 12sections-2zips-L5
            sections: "12"
            zips: "2"
            level: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build this configuration here and run it
        env:
          NX_SECTIONS: ${{ matrix.sections }}
          NX_ZIPS: ${{ matrix.zips }}
          NX_OPT_LEVEL: ${{ matrix.level }}
          NX_WATERMARK: ${{ matrix.label }}
        run: python scripts/ci/build_on_platform.py
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-artefact-config-${{ matrix.label }}-${{ matrix.os }}
          path: ci-artifacts/
          if-no-files-found: ignore

  flags:
    # Isolated packing-CLI flags. NOTE the limitation, stated rather than hidden:
    # `ai-obf build` exposes a small flag set -- the 273 flags that the ladder is
    # made of belong to scripts/build.py, which this helper does not drive yet.
    # So this job isolates what the packing CLI has, and the per-transform
    # isolation of the ladder remains untested.
    name: flag ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-section-split
            args: "--no-section-split"
          - label: sections-2
            args: "--section-split --section-count 2"
          - label: sections-12
            args: "--section-split --section-count 12"
          - label: opt-level-1
            args: "--opt-level 1"
          - label: opt-level-2
            args: "--opt-level 2"
          - label: opt-level-4
            args: "--opt-level 4"
          # --stego is deliberately absent: it emits an image carrier the
          # harness does not load, so the artefact prints nothing and the check
          # would report a failure of this script, not of the product.
          # --stego is back. It was dropped when the artefact printed nothing,
          # which turned out to be two real encoder bugs (a double-escaped ZWS
          # character and a Latin-1/UTF-8 mix-up), both now fixed.
          - label: stego
            args: "--stego"
          - label: pin-structure
            args: "--pin-structure"
          - label: strict-detections
            args: "--strict-detections"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build with this flag isolated and run it
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "5"
          NX_EXTRA_FLAGS: ${{ matrix.args }}
        run: python scripts/ci/build_on_platform.py
  ladder-flags:
    # Isolated ladder transforms. These live in scripts/build.py, not in
    # `ai-obf build`, so they need their own helper -- this is the coverage the
    # flag job could not reach.
    name: ladder ${{ matrix.flag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flag: cfg-flatten, args: "--cfg-flatten" }
          - { flag: opaque-predicates, args: "--opaque-predicates" }
          - { flag: mba-subs, args: "--mba-subs" }
          - { flag: fragment-strings, args: "--fragment-strings" }
          - { flag: bogus-exceptions, args: "--bogus-exceptions" }
          - { flag: rename-internal, args: "--rename-internal" }
          - { flag: unicode-ids, args: "--unicode-ids" }
          - { flag: class-dispatch, args: "--class-dispatch" }
          - { flag: honey-functions, args: "--honey-functions 8" }
          - { flag: poison-level-5, args: "--poison-level 5" }
          - { flag: llm-resilient, args: "--llm-resilient" }
          - { flag: randomization-3, args: "--randomization-level 3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build with this ladder flag isolated and run it
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "5"
          NX_EXTRA_FLAGS: ${{ matrix.args }}
        run: python scripts/ci/build_with_flag.py
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-ladder-${{ matrix.flag }}
          path: ci-artifacts/
          if-no-files-found: ignore
