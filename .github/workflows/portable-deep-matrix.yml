name: Portable build matrix (deep)

# The configurations, isolated packing flags and isolated ladder transforms.
# These are the expensive half of the matrix: 32 jobs. They ran on every push
# until the runner queue could no longer keep up, at which point pushing made
# verification slower rather than faster.
#
# They still run in full -- on demand, and once a week -- and every job is
# capped at 45 minutes so nothing can hold a runner for the platform's six-hour
# job limit.

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  configs:
    name: config ${{ matrix.label }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: 2sections-3zips-L3
            sections: "2"
            zips: "3"
            level: "3"
          - os: ubuntu-latest
            label: 8sections-1zip-L4
            sections: "8"
            zips: "1"
            level: "4"
          - os: ubuntu-latest
            label: 6sections-2zips-L5
            sections: "6"
            zips: "2"
            level: "5"
          - os: ubuntu-latest
            label: 12sections-2zips-L5
            sections: "12"
            zips: "2"
            level: "5"
          - os: windows-latest
            label: 2sections-3zips-L3
            sections: "2"
            zips: "3"
            level: "3"
          - os: windows-latest
            label: 8sections-1zip-L4
            sections: "8"
            zips: "1"
            level: "4"
          - os: windows-latest
            label: 6sections-2zips-L5
            sections: "6"
            zips: "2"
            level: "5"
          - os: windows-latest
            label: 12sections-2zips-L5
            sections: "12"
            zips: "2"
            level: "5"
          - os: macos-latest
            label: 2sections-3zips-L3
            sections: "2"
            zips: "3"
            level: "3"
          - os: macos-latest
            label: 8sections-1zip-L4
            sections: "8"
            zips: "1"
            level: "4"
          - os: macos-latest
            label: 6sections-2zips-L5
            sections: "6"
            zips: "2"
            level: "5"
          - os: macos-latest
            label: 12sections-2zips-L5
            sections: "12"
            zips: "2"
            level: "5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pinned immutable; original actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build this configuration here and run it
        env:
          NX_SECTIONS: ${{ matrix.sections }}
          NX_ZIPS: ${{ matrix.zips }}
          NX_OPT_LEVEL: ${{ matrix.level }}
          NX_WATERMARK: ${{ matrix.label }}
        run: python scripts/ci/build_on_platform.py
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pinned immutable; original actions/upload-artifact@v7.0.2
        with:
          name: failing-artefact-config-${{ matrix.label }}-${{ matrix.os }}
          path: ci-artifacts/
          if-no-files-found: ignore

  flags:
    # Isolated packing-CLI flags. NOTE the limitation, stated rather than hidden:
    # `ai-obf build` exposes a small flag set -- the 273 flags that the ladder is
    # made of belong to scripts/build.py, which this helper does not drive yet.
    # So this job isolates what the packing CLI has, and the per-transform
    # isolation of the ladder remains untested.
    name: flag ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-section-split
            args: "--no-section-split"
          - label: sections-2
            args: "--section-split --section-count 2"
          - label: sections-12
            args: "--section-split --section-count 12"
          - label: opt-level-1
            args: "--opt-level 1"
          - label: opt-level-2
            args: "--opt-level 2"
          - label: opt-level-4
            args: "--opt-level 4"
          # --stego is deliberately absent: it emits an image carrier the
          # harness does not load, so the artefact prints nothing and the check
          # would report a failure of this script, not of the product.
          # --stego is back. It was dropped when the artefact printed nothing,
          # which turned out to be two real encoder bugs (a double-escaped ZWS
          # character and a Latin-1/UTF-8 mix-up), both now fixed.
          - label: stego
            args: "--stego"
          - label: pin-structure
            args: "--pin-structure"
          - label: strict-detections
            args: "--strict-detections"
          # Counter-REA exclusion matrix: each bait layer excluded on its own,
          # every layer excluded at once, and the two profile flags. The unit
          # tests pin the option mapping (test_loader_controls_wired.py); these
          # jobs pin that each combination BUILDS and the artefact RUNS.
          - label: exclude-rea-bio
            args: "--exclude-rea-bio"
          - label: exclude-rea-cognitive
            args: "--exclude-rea-cognitive"
          - label: exclude-rea-compliance
            args: "--exclude-rea-compliance"
          - label: exclude-rea-all
            args: "--exclude-rea"
          - label: anti-rea-level-maximum
            args: "--anti-rea-level maximum"
          - label: fast
            args: "--fast"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pinned immutable; original actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build with this flag isolated and run it
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "5"
          NX_EXTRA_FLAGS: ${{ matrix.args }}
        run: python scripts/ci/build_on_platform.py
  ladder-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      flags: ${{ steps.list.outputs.flags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pinned immutable; original actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: list
        name: Derive every isolatable ladder flag from the live parser
        run: echo "flags=$(python scripts/ci/matrix_flags.py --all)" >> "$GITHUB_OUTPUT"

  ladder-flags:
    # Isolated ladder transforms. These live in scripts/build.py, not in
    # `ai-obf build`, so they need their own helper. The matrix is derived from
    # the live argparse catalogue; stale hand-written flag names cannot reach
    # the builder and fail every job with argparse exit 2.
    name: ladder ${{ matrix.flag }}
    needs: ladder-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJSON(needs.ladder-catalogue.outputs.flags) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pinned immutable; original actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build with this ladder flag isolated and run it
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "5"
          NX_EXTRA_FLAGS: ${{ matrix.flag }}
        run: python scripts/ci/build_with_flag.py
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pinned immutable; original actions/upload-artifact@v7.0.2
        with:
          name: failing-ladder-${{ matrix.flag }}
          path: ci-artifacts/
          if-no-files-found: ignore
