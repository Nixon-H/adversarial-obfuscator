name: Shadow Compiler Build
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Build seed (hex). Leave empty for random.'
        required: false
        default: ''

# Least privilege: read-only default token.
permissions:
  contents: read

jobs:
  shadow-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y llvm clang lld
      
      - name: Print Build Info
        run: |
          echo "Build ID: $(date +%s)-$(git rev-parse --short HEAD)"
          echo "Seed: ${{ github.event.inputs.seed || 'random' }}"
          echo "Stages: obfuscate → irgen → llvmgen → encrypt → relay → runtime"
      
      - name: Stage 1 - Obfuscate
        # NOTE: obfuscator/core.py was a dead 2-line shim (removed); the
        # canonical entry point is scripts/build.py (shadow-compiler 2.0.0).
        # Payload is the checked-in examples/hello.py fixture (there is no
        # repo-root payload.py; a missing payload would fail the stage).
        run: python3 scripts/build.py --payload examples/hello.py --skip-relay --skip-extras

      - name: Stage 2 - IR Compile
        # scripts/build.py stages .build_tmp_<stem>_obfuscated.py and the
        # package step renames it to <stem>_obfuscated.py, so the payload
        # stem (hello) is part of the path the later stages read.
        run: python3 -m irgen build/hello_obfuscated.py -o build/program.ir

      - name: Stage 3 - LLVM Codegen
        # NOTE: llvmgen takes -O/--ollvm-passes (bcf/fla/sub...), not bare
        # --bcf/--fla/--sub flags.
        # Seed pinned: llvmgen's pass selection and label naming are
        # randomised, so an unpinned run is a fuzz test of the IR emitter (a
        # rare invalid-IR seed failed here once: llc "expected value token").
        #
        # This pins ONE axis only.  The IR this stage consumes is not
        # reproducible either: two runs of Stage 1 with the same
        # --randomization-seed and --build-id still produce different
        # output (md5 93c0ec9… vs 8116aff…), so the job can still fail on
        # the content axis.  It fails loudly (llc rejects the .ll and the
        # build aborts), which is why the pin is worth keeping rather than
        # treating this job as a guarantee.
        env:
          NIXON_LLVM_SEED: "0xDEADBEEF"
        run: python3 -m llvmgen build/program.ir -o build/program.o -O bcf fla sub

      - name: Stage 4 - Block Encryption
        # NOTE: encrypt is a subcommand CLI (encrypt/pack/unpack/info/
        # gen-seed); --seed belongs to `gen-seed`, not `encrypt`.
        run: python3 -m encrypt encrypt build/program.o -o build/encrypted.o
      
      - name: Stage 5 - Link Relay
        run: make relay
      
      - name: Generate Build Manifest
        run: |
          echo "{
            \"build_time\": \"$(date -Iseconds)\",
            \"git_hash\": \"$(git rev-parse HEAD)\",
            \"seed\": \"${{ github.event.inputs.seed || 'random' }}\",
            \"stages\": [\"obfuscate\",\"irgen\",\"llvmgen\",\"encrypt\",\"relay\"]
          }" > build/build-manifest.json
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-build
          path: build/
          retention-days: 30
