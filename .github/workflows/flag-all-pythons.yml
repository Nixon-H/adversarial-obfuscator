name: Flags x all Python versions (manual + release)

# Every catalogue flag (30 today), isolated, on every supported interpreter.
# Coverage tier A2: a transform that depends on the interpreter (ast.unparse
# differences, changed AST node shapes) shows up here and nowhere else.
#
# 3 shards x 10 flags x 5 Pythons = 15 jobs.
# Runs manually while stabilising, and automatically on every published release.

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  isolate:
    name: py${{ matrix.python }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pinned immutable; original actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # pinned immutable; original actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build and run 10 flags on this interpreter
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: "3"
          NX_BUILD_TIMEOUT: "1800"
          PYTHONHASHSEED: "0"
          NX_BUILD_SEED: "12345"
        run: python scripts/ci/isolate_flags.py --start $(( ${{ matrix.shard }} * 10 )) --count 10
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pinned immutable; original actions/upload-artifact@v7
        with:
          name: failing-py${{ matrix.python }}-shard-${{ matrix.shard }}
          path: |
            ci-artifacts/
            build/*_obfuscated.py
          if-no-files-found: ignore
