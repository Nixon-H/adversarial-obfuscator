name: Flag isolation (manual)

# Every ladder flag, isolated: one build per flag, on a payload that exercises
# classes, closures, generators, dataclasses, match and async.
#
# MANUAL ONLY while the project stabilises. When it is stable, add
# `push:` to the `on:` block below and this becomes the regression net that
# catches a broken transform within minutes of the commit that broke it.
#
# The catalogue is generated from scripts/build.py itself, so a new flag is
# picked up without editing this file.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of parallel shards (30 catalogue flags, 10 per shard)"
        default: "3"
        required: false
      level:
        description: "opt-level used for the isolated builds"
        default: "3"
        required: false
permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.cat.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pinned immutable; original actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: cat
        name: Catalogue the ladder flags
        run: |
          python scripts/ci/flag_catalogue.py
          echo "shards=${{ github.event.inputs.shards || '3' }}" >> "$GITHUB_OUTPUT"

  isolate:
    needs: catalogue
    name: flags shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # pinned immutable; original actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # pinned immutable; original actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build and run each flag in this shard
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/constructs_source.py
          NX_OPT_LEVEL: ${{ github.event.inputs.level || '3' }}
          # Pin both kinds of process randomness: str hashing (PYTHONHASHSEED)
          # and the transform order (NX_BUILD_SEED).
          PYTHONHASHSEED: "0"
          NX_BUILD_SEED: "12345"
          # --code-genome alone takes more than thirteen minutes.
          NX_BUILD_TIMEOUT: "1800"
        run: |
          # 30 catalogue flags over 3 shards: 10 per shard.
          python scripts/ci/isolate_flags.py --start $(( ${{ matrix.shard }} * 10 )) --count 10
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # pinned immutable; original actions/upload-artifact@v7.0.2
        with:
          name: failing-flag-shard-${{ matrix.shard }}
          path: |
            ci-artifacts/
            build/*_obfuscated.py
          if-no-files-found: ignore
