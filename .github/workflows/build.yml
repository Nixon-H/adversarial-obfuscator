name: Nixon Build Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

# Least privilege: read-only default token (no job here publishes releases).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LLVM (llc for the lowering tests)
        # Same reason as the CI workflow: ~21 IR->LLVM regression tests
        # skip without llc, so this job was green while never running
        # them.
        run: |
          if ! command -v llc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          if ! command -v llc >/dev/null 2>&1; then
            LLC="$(ls /usr/lib/llvm-*/bin/llc 2>/dev/null | head -1)"
            if [ -n "$LLC" ]; then sudo ln -sf "$LLC" /usr/local/bin/llc; fi
          fi
          command -v llc
          llc --version | head -1
      - name: Install Python deps
        run: |
          # requirements.lock is hash-pinned: --require-hashes makes a
          # substituted or tampered artefact fail the install instead of
          # landing.  requirements.txt states the wanted versions; the
          # lock states the exact artefacts allowed.
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          pip install pytest
      - name: Lint Python
        # The gate must be reproducible: requirements-dev.txt pins ruff
        # exactly, so a rule change upstream cannot turn a clean tree
        # red without a deliberate bump of the pin.
        run: make lint
      - name: Run Python tests
        run: python3 -m pytest tests/ -v
      - name: Install LLVM (llc for the codegen stage)
        # scripts/build.py requires llc; the runner image does not ship it,
        # so this step failed with "ERROR: Missing dependency: llc" and
        # the smoke build (and the e2e check after it) never ran.  The
        # unversioned binary is not guaranteed by the metapackage, so fall
        # back to the versioned one.
        run: |
          if ! command -v llc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          if ! command -v llc >/dev/null 2>&1; then
            LLC="$(ls /usr/lib/llvm-*/bin/llc 2>/dev/null | head -1)"
            if [ -n "$LLC" ]; then sudo ln -sf "$LLC" /usr/local/bin/llc; fi
          fi
          command -v llc && llc --version | head -1
      - name: Obfuscate test payload
        run: python3 scripts/build.py --payload tests/fixtures/test_payload.py --skip-relay --no-cfg-flatten
      - name: Feature report generated from the artefact
        # The build writes build/artefact_manifest.json (artefact hash,
        # C symbols, Rust modules reachable + enabled, loader gates it
        # could prove). Feeding it back is what makes "exercised"
        # answerable instead of "unknown" -- previously the report was
        # only ever run by hand, against no evidence at all.
        #
        # It is expected to print live=0 for now: the manifest's
        # vocabulary (rust module names, FHE/ORAM symbols) does not line
        # up with the 129-entry feature list, so most features stay
        # "unverified". The assertion is that the manifest was actually
        # read, not that anything is live.
        run: |
          python3 -m scripts.classify_features --from-build build \
            --output build/feature_classification.json
          python3 -c "import json; r=json.load(open('build/feature_classification.json')); assert r['artefact_manifest'], 'the artefact manifest was not read'; print('report summary:', r['summary'])"
      - name: End-to-end artifact check
        # Build a payload, RUN the artifact it produced, and assert the
        # output.  This is the class of regression the unit suite
        # structurally cannot see: the seal-corruption bug produced
        # artifacts that died at import, and every unit test still
        # passed.  A build that does not RUN is a failed build.
        run: python3 scripts/lint/e2e_build_check.py 2
      - name: Fuzz smoke (60s per target)
        # cargo-fuzz needs nightly; the fuzz crate builds on stable via
        # `cargo test --no-run`, but libfuzzer execution requires nightly.
        # Best-effort: short libFuzzer runs catch parser crashes without
        # blocking the pipeline (continue-on-error; crashes upload below).
        continue-on-error: true
        run: |
          rustup toolchain install nightly --component rust-src 2>/dev/null || true
          cargo +nightly fuzz run config_parse -- -max_total_time=60 2>&1 | tail -5 || true
          cargo +nightly fuzz run fuzz_target_1 -- -max_total_time=60 2>&1 | tail -5 || true
        working-directory: relay/fuzz
      - name: Upload fuzz crashers
        # always(): the smoke step above ends 0 by design
        # (continue-on-error + `|| true`), so `if: failure()` would never
        # fire and crashers would never upload. always() + if-no-files-found
        # keeps the step green when there is nothing to upload.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: relay/fuzz/artifacts/
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-unknown-linux-gnu
      - name: Build Rust relay
        run: make relay
      - name: Install LLVM (llc for the codegen stage)
        # Same dependency as the smoke build in the `test` job: the runner
        # image does not ship llc, and scripts/build.py refuses to run
        # without it.
        run: |
          if ! command -v llc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          if ! command -v llc >/dev/null 2>&1; then
            LLC="$(ls /usr/lib/llvm-*/bin/llc 2>/dev/null | head -1)"
            if [ -n "$LLC" ]; then sudo ln -sf "$LLC" /usr/local/bin/llc; fi
          fi
          command -v llc && llc --version | head -1
      - name: Run pipeline (full)
        run: python3 scripts/build.py --payload tests/fixtures/test_payload.py --skip-relay
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbital-relay-linux
          path: build/orbital-relay
          if-no-files-found: warn

  build-win:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-unknown-linux-gnu
      - name: Install MinGW
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Cross-compile for Windows
        continue-on-error: true
        run: make relay-win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-relay-win
          path: build/orbital-relay-win.exe
          if-no-files-found: warn

  build-linux-arm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-unknown-linux-gnu
      - name: Install ARM64 GCC
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile for ARM64
        continue-on-error: true
        run: make relay-linux-arm
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-relay-linux-arm
          path: build/orbital-relay-linux-arm
          if-no-files-found: warn
