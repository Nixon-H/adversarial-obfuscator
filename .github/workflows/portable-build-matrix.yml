name: Portable build matrix

# Every supported OS x every supported Python, building ON that combination and
# running what it built, plus every build configuration. The artefact pins the
# interpreter it was built for, so a Python version can only be covered by
# building on that version -- running one build everywhere would test only 3.13.
#
# Runs on every push: the point is a broad safety net, not a targeted check.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-run:
    name: build+run ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build here and run the result
        env:
          NX_SECTIONS: "6"
          NX_ZIPS: "2"
          NX_OPT_LEVEL: "5"
          NX_WATERMARK: "matrix"
          NX_HANG_TRACE: "1"
        run: python scripts/ci/build_on_platform.py
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-artefact-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-artifacts/
          if-no-files-found: ignore

  audit-built:
    # Build here, then put the thing it just built through the 12 environment checks.
    name: build+audit ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build on this platform
        run: python scripts/ci/build_on_platform.py
      - name: Audit the committed fixture
        run: python scripts/ci/audit_artefact.py

  audit-has-teeth:
    # An audit that cannot fail proves nothing: point it at a file that prints
    # the wrong thing and require every check to catch it.
    name: audit has teeth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every check must fail against a broken artefact
        run: |
          printf 'print("wrong output")\n' > /tmp/broken.py
          set +e
          AUDIT_ARTEFACT=/tmp/broken.py python scripts/ci/audit_artefact.py > /tmp/selftest.log 2>&1
          rc=$?
          set -e
          tail -3 /tmp/selftest.log
          grep -q "12 checks, 12 failed" /tmp/selftest.log || {
            echo "::error::the audit did not fail on a broken artefact -- its checks are not real"
            exit 1
          }
          test "$rc" -ne 0 || { echo "::error::audit exited 0 on a broken artefact"; exit 1; }
          echo "all 12 checks caught the broken artefact"

  diagnose:
    # Known crash: ACCESS_VIOLATION (0xC0000005) building on Windows + 3.14.
    # An access violation cannot be caught, so the script prints and flushes
    # before each step and the last line names it. continue-on-error so the
    # diagnosis reports without masking the red cell it is investigating.
    name: diagnose windows py3.14 crash
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Which step kills the process
        run: |
          python -VV
          python -m pip list
          python scripts/ci/diagnose_build_crash.py

  payloads:
    # Different payload TYPES, not just different build settings. The dataclass,
    # nonlocal and global bugs were invisible until a payload using those
    # constructs was built.
    name: payload ${{ matrix.payload }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        payload: [secure_demo_source.py, constructs_source.py]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install builder dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build this payload here and run it
        env:
          NX_PAYLOAD: ${{ github.workspace }}/tests/fixtures/portable/${{ matrix.payload }}
          NX_OPT_LEVEL: "5"
          NX_HANG_TRACE: "1"
        run: python scripts/ci/build_on_platform.py
      - name: Keep the failing artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-payload-${{ matrix.payload }}-${{ matrix.os }}
          path: ci-artifacts/
          if-no-files-found: ignore

