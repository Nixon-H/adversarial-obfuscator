# Dependabot configuration.
#
# WHY THIS FILE EXISTS
#
# Pinning the build dependencies (finding AI-SC-003) made Dependabot able to see
# setuptools and wheel for the first time, and it immediately reported three
# advisories -- one HIGH. That is the good outcome: pinning buys visibility.
#
# It also exposed a gap. After both packages were bumped past their patched
# versions (setuptools 80.9.0 -> 84.2.1, wheel 0.45.1 -> 0.48.0, commit
# ca2b12d), GitHub's dependency graph STILL resolved the OLD versions and the
# alerts stayed open. Timestamps confirm it was a lag, not a miss: the alerts
# were created at 10:27Z and the fix landed at 12:45Z, and no re-scan had run.
#
# There is no REST endpoint to force a dependency-graph rescan, so the durable
# fix is this file: it makes the update path explicit and gives Dependabot a
# scheduled job that will reconcile the graph instead of waiting for an
# incidental manifest change.
#
# The groups are deliberate. Build tooling is grouped because setuptools and
# wheel must move together for the Cython path -- a lone bump of one has twice
# produced a wheel/setuptools mismatch in this repository's history.
version: 2
updates:
  # The hash-locked runtime + build dependency set. One group: these are the
  # packages that reach an artefact, so they should be reviewed as one change
  # with the lock diff alongside.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        patterns:
          - "setuptools"
          - "wheel"
          - "cython"
      runtime:
        patterns:
          - "requests"
          - "urllib3"
          - "cryptography"
          - "numpy"
          - "cffi"
    # requirements.lock is regenerated by hand after a bump
    # (`uv pip compile --generate-hashes`), so a Dependabot PR that only edits
    # requirements.txt would leave the lock stale. The notes in
    # requirements.lock say the same thing; repeating it here because this is
    # where the reviewer of the PR will look.
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions. Finding AI-SC-002 records 91 tag-pinned references that
  # should be immutable commit SHAs; Dependabot's github-actions ecosystem
  # rewrites pins to SHAs and keeps them current, which is the mechanical path
  # to closing that finding without hand-resolving 91 SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
