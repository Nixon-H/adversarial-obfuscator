[package]
name = "orbital-relay"
version = "0.1.0"
edition = "2021"
authors = ["nixon"]

[lib]
name = "orbital_relay"
path = "src/lib.rs"

[features]
default = ["attestation"]
full-network = []
attestation = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"
anyhow = "1"
thiserror = "1"
libc = "0.2"
nixon-runtime = { path = "../runtime" }

# Anti-debug (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "ptrace"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
