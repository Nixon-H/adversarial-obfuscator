[pytest]
# tests/test_data/ holds obfuscator fixture OUTPUTS (e.g.
# test_multi_func.py.decoy.py, *.attention_poison.py) that pytest's default
# test_*.py glob would otherwise try to import as test modules
# (dotted name 'test_multi_func.py...' unresolvable -> collection error).
# adversarial_loop.py references tests/test_data/test_multi_func.py directly,
# so the directory must stay; it just must not be collected.
norecursedirs = test_data fixtures
# bench_*.py files contain real test_* functions (benchmarks) that the
# default test_*.py glob never collects. Include both patterns so the
# 24 bench files with test functions run in CI.
python_files = test_*.py bench_*.py
