# Lint gate for the Shadow Compiler pipeline.
#
# The rule set is deliberately narrow: only the pyflakes checks that
# catch real defects are enforced, and every excluded category carries
# its reason below.
#
# Enforced:
#   F401  unused import
#   F402  import shadowed by a loop variable
#   F541  f-string without placeholders
#   F601  multi-value repeated key (dict literal)
#   F602  multi-value repeated key (dict comprehension)
#   F811  redefinition of an unused name
#   F821  undefined name
#   F841  local variable assigned but never used
#
# Ignored on purpose:
#   F403  `from .mod import *` -- the package's own modules import each
#         other that way and re-export through obfuscator/core/__init__.py.
#         Replacing it is an architectural change, not a lint cleanup.
#   F405  "may be undefined, or defined from star imports" -- the
#         consequence of the above: a name that comes from a star import
#         is not checked for existence in the module that uses it.  The
#         modules that do NOT use star imports are fully checked.

line-length = 120
target-version = "py310"

# Not our code, and not generated by us:
#   archive/  vendored third-party samples (nyami.cc outputs) kept as
#             reference material -- byte-for-byte, so they must not be
#             reformatted.
#   docs/     the transfer-research experiment artifacts under
#             docs/research/h0h5-results/ are generated program output.
exclude = [
    "archive",
    "docs",
    "build",
    ".opencode",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "node_modules",
]

[lint]
select = [
    "F401",
    "F402",
    "F541",
    "F601",
    "F602",
    "F811",
    "F821",
    "F841",
]
ignore = [
    "F403",
    "F405",
]

[lint.per-file-ignores]
# Deliberate decoy / prompt-poison fixtures.  These files are TEST DATA:
# they are meant to contain undefined names, injected instructions and
# duplicated keys, because that is what the decoy and poison tests
# assert on.
"tests/test_data/*" = ["F401", "F402", "F541", "F601", "F602", "F811", "F821", "F841"]
