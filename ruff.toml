# Lint gate for the Shadow Compiler pipeline.
#
# The rule set is the whole pyflakes family ("F").  Every check in it
# catches a real defect -- an unused import, a shadowed name, a
# redefined name, an undefined name, an unused local, a repeated dict
# key, an f-string without placeholders -- and the tree is clean under
# all of them.
#
# Enforced: every F check.  Notably
#   F401  unused import
#   F402  import shadowed by a loop variable
#   F403  `from .mod import *` (the core package no longer uses it)
#   F405  a name that may be undefined
#   F541  f-string without placeholders
#   F601/F602  a repeated dict key
#   F811  redefinition of an unused name
#   F821  undefined name
#   F841  local variable assigned but never used
#
# F403 and F405 used to be ignored, because the core package imported
# its own modules with `from .mod import *` and re-exported them
# through `obfuscator/core/__init__.py`.  The core package now spells
# its imports out (the facade is generated by
# `scripts/lint/generate_core_facade.py`, and `make lint` fails if it
# is stale), so both checks are enforced.
#
# NOT enforced, on purpose:
#   E/W  pycodestyle.  This tree does not follow PEP 8 spacing; the
#         code is written in a dense, single-line-statement style that
#         a style migration would rewrite wholesale.  That is a
#         migration, not a cleanup.
#   B    bugbear.  Mostly `B008`/`B006` (mutable defaults) and
#         `B023` (closure over a loop variable) -- the last one is a
#         real pattern in the emitted loader templates, where each
#         function is built in its own scope.
#   SIM  flake8-simplify.  The simplifications it suggests (e.g.
#         `dict(a, b=1)` -> `{**a, "b": 1}`) are rewrites, not
#         fixes, and they are unsafe inside the emitted templates,
#         which are string-built and formatted.
#   UP   pyupgrade.  Would rewrite the code to a newer syntax
#         throughout, including inside the generated loader source.
#   C4/RET  comprehensions and returns.  Style.
#
# In short: the gate covers the checks that find DEFECTS.  The
# remaining families are style migrations, and applying them
# mechanically to a tree whose loader source is itself generated is
# exactly the kind of change that damages the templates.

line-length = 120
target-version = "py310"

# Not our code, and not generated by us:
#   archive/  vendored third-party samples (nyami.cc outputs) kept as
#             reference material -- byte-for-byte, so they must not be
#             reformatted.
#   docs/     the transfer-research experiment artifacts under
#             docs/research/h0h5-results/ are generated program output.
exclude = [
    "archive",
    "docs",
    "build",
    ".opencode",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "node_modules",
]

[lint]
# The whole pyflakes family.
select = ["F"]

[lint.per-file-ignores]
# Deliberate decoy / prompt-poison fixtures.  These files are TEST DATA:
# they are meant to contain undefined names, injected instructions and
# duplicated keys, because that is what the decoy and poison tests
# assert on.
"tests/test_data/*" = ["F"]
